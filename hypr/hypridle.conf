general {
    # Отключение автоматического выхода из спящего режима
    lock_cmd = pidof hyprlock || hyprlock
}

# --- ТАЙМЕРЫ ДЛЯ БЛОКИРОВКИ ---
listener {
    # 300 секунд = 5 минут бездействия
    timeout = 300

    # Команда, которая будет выполнена после тайм-аута (блокировка)
    on-timeout = hyprlock

    # Команда, которая будет выполнена при возобновлении активности
    on-resume =
}

