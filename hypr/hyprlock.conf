background {
	monitor = DP-3
	path = screenshot 
	#color = rgba
	blur_passes = 2
	blur_size = 2
	contrast = 1
	brightness = 0.8
	vibrancy = 0.16
	vibrancy_darkness = 0.1
}
label {
	monitor = DP-3
	text = cmd[update:1000] echo "$(~/Документы/code/скрипты/time-my-pc.sh)"
	color = rgba(230, 126, 128, 0.9)
	font_size = 28
	font_family = JetBrains Mono
	shadow_passes = 2
	shadow_size = 2
	position = 0, -80
	halign = center
	valign = center
}
label {
	monitor = DP-3
	text = cmd[update:60000] echo "$(date +"%A, %d %B")"
	color = rgba(219, 188, 127, 0.9)
	font_size = 36
	font_family = JetBrains Mono
	shadow_passes = 2
	shadow_size = 2
	position = 0, 140
	halign = center
	valign = center
}
label {
	monitor = DP-3
	text = $TIME
	color = rgba(220, 215, 186, 0.9)
	font_size = 72
	font_family = JetBrains Mono Extrabold
	shadow_passes = 2
	shadow_size = 2
	position = -280, 30
	halign = center
	valign = center
}
label {
	monitor = DP-3
	# Создания файла метки для расчёта времени секундамера
	text = cmd[update:0] echo "$(touch /tmp/hyprlock_start_marker)" 
	color = rgba(220, 215, 186, 0)
	font_size = 0
}
label {
	monitor = DP-3
	# Расчёт времени секундамера
	text = cmd[update:100] echo "$(~/.local/bin/hyprlock_timer /tmp/hyprlock_start_marker)" 
	color = rgba(220, 215, 186, 0.9)
	font_size = 72
	font_family = JetBrains Mono Extrabold
	shadow_passes = 2
	shadow_size = 2
	position = +220, 30
	halign = center
	valign = center
}
#label {
	monitor = DP-3
	#text = cmd[update:1000] echo "$(tail -F /tmp/eww-backend-pipes/timer | jq -r '.text')"
	color = rgba(219, 188, 127, 0.9)
	font_size = 36
	font_family = JetBrains Mono
	shadow_passes = 2
	shadow_size = 2
	position = +340, 140
	halign = center
	valign = center
}
input-field {
    monitor = DP-3
    size = 400, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.5
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgba(220, 215, 186, 0.8)
    font_family = JetBrains Mono
    fade_on_empty = false
    fade_timeout = 5000
    placeholder_text = Пароль — qAzEdcWsX
    #hide_input = 
    #hide_input_base_color = 
    #rounding = 
    check_color = rgb(204, 136, 34)
    fail_color = rgba(204, 34, 34, 1.0)
    fail_text =  Руки убери!!!
    position = 0, -200
    halign = center
    valign = center
}