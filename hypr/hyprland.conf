#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 10

    border_size = 2

    col.active_border = rgba(d3c6aaff)
    col.inactive_border = rgba(595959aa)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    bezier = nk,             0,    1,    1,    1

    #           NAME,                ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,              1,     10,    default
    animation = border,              1,     5.39,  easeOutQuint
    animation = windows,             1,     4.79,  easeOutQuint, slide
    animation = windowsIn,           1,     4.1,   easeOutQuint, slide
    animation = windowsOut,          1,     1.49,  linear,       popin
    animation = windowsMove,         1,     2.49,  nk
    animation = fadeIn,              1,     1.73,  almostLinear
    animation = fadeOut,             1,     1.46,  almostLinear
    animation = fade,                1,     3.03,  quick
    animation = layers,              1,     3.81,  easeOutQuint
    animation = layersIn,            1,     3.5,   easeOutQuint, slidefade
    animation = layersOut,           1,     1.5,   linear,       popin
    animation = fadeLayersIn,        1,     1.79,  almostLinear
    animation = fadeLayersOut,       1,     1.39,  almostLinear
    animation = workspaces,          1,     2.54,  nk
    animation = workspacesIn,        1,     1.81,  nk,           slidefade
    animation = workspacesOut,       1,     2.14,  nk,           slide
    animation = specialWorkspaceIn,  1,     1.81,  nk,           slidefadevert
    animation = specialWorkspaceOut, 1,     2.14,  linear,       slidevert
    animation = zoomFactor,          1,     7,     quick
}

##################
### WINDOWRULE ###
##################

# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
#workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
#windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
#windowrule = rounding 0, floating:0, onworkspace:w[tv1]
#windowrule = bordersize 0, floating:0, onworkspace:f[1]
#windowrule = rounding 0, floating:0, onworkspace:f[1]
windowrule = match:float on, match:class (clipse)
windowrule = size 622 652, match:class (clipse)
#windowrule = stayfocused, match:class (clipse)

### MY WINDOWRULE

#### Доп. правила


#### Основные правила



##### Size & window
windowrule = center 1, match:class io.github.elyprismlauncher.ElyPrismLauncher
windowrule = float on, match:class io.github.elyprismlauncher.ElyPrismLauncher title:
windowrule = size 1200 600, match:class io.github.elyprismlauncher.ElyPrismLauncher
windowrule = float on, match:class swayimg
#windowrule = tag +music, match:title youtui
windowrule = size 700 500, match:class org.pulseaudio.pavucontrol
windowrule = float on, match:class org.pulseaudio.pavucontrol
windowrule = float on, match:class flameshot
windowrule = float on, match:class PortProton
windowrule = float on, match:class thunar, match:title ^(Переименовать).*
windowrule = size 600 100, match:class thunar, match:title ^(Переименовать).*

##### Workspace
windowrule = workspace 6, match:class obsidian
windowrule = workspace 1, match:class zen
windowrule = workspace 10, match:class dev.zed.Zed
windowrule = workspace special:music silent, match:class spotify
windowrule = workspace special:music silent, match:class YandexMusic
windowrule = workspace special:terminal, match:class kitty
windowrule = workspace special:easyeffects silent, match:class com.github.wwmm.easyeffects



#################
### LAYERRULE ###
#################

layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace rofi
layerrule = blur on, match:namespace snappy-switcher
layerrule = ignore_alpha 0, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace snappy-switcher


dwindle {
    #pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

input {
    kb_layout = us,ru
    kb_variant = ,
    kb_model =
    kb_options = grp:caps_toggle,compose:rctrl
    kb_rules =


    # Настройки мыши
    sensitivity = 1.0 # значение по умолчанию
    accel_profile = flat
    follow_mouse = 1

    # настройка курсора
    env = XCURSOR_THEME,GoogleDot-White

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

# Example per-device config
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

##################
### WORKSPACES ###
##################

workspace = special:music
workspace = special:terminal
workspace = special:games
workspace = special:easyeffects

###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$mainS = SHIFT
$mainC = CTRL
$mainA = ALT

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod+Shift, End, exec, ~/Документы/code/скрипты/safe_shutdown.sh
bind = $mainA, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = Shift+$mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, J, togglesplit, # dwindle
bind = $mainC $mainA, D, exec, $cleaner
bind = , Print, exec, flameshot gui
bind = $mainS, Print, exec, flameshot screen
bind = $mainMod, V, exec, $menu-clip
bind = $mainMod, Z, exec, $zed
bind = $mainMod, F11, fullscreen, 1
bind = $mainMod+$mainS, F11, fullscreen, 0
bind = $mainMod, A, exec, $menu-translate
bind = $mainMod+$mainC, A, exec, $menu-translate --copy
bind = $mainMod+$mainS, D, exec, $menu-calc
bind = $mainMod, R, exec, ~/Документы/code/скрипты/workspace_jump.sh
bind = $mainMod $mainA, V, exec, wofi-emoji
bind = $mainMod, U, exec, hyprpicker -a -f rgb
bind = $mainMod+$mainS, P, exec, $keepass
bind = $mainMod, B, exec, $menu-galery
bind = $mainMod, T, exec, /home/kasper/.config/rofi/rofi-tran-live.py

bind = ALT, Tab, exec, snappy-switcher next
bind = ALT SHIFT, Tab, exec, snappy-switcher prev

#bind = $mainMod, Tab, hyprexpo:expo, toggle
#bind = $mainA, right, layoutmsg, focus r
#bind = $mainA, left, layoutmsg, focus l

# Move focus with mainMod + arrow keys
bind = $mainA, left, movefocus, l
bind = $mainA, right, movefocus, r
bind = $mainA, up, movefocus, u
bind = $mainA, down, movefocus, d

bind = $mainS, left, movewindow, l
bind = $mainS, right, movewindow, r
bind = $mainS, up, movewindow, u
bind = $mainS, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod $mainC, 1, workspace, 11
bind = $mainMod $mainC, 2, workspace, 12
bind = $mainMod $mainC, 3, workspace, 13
bind = $mainMod $mainC, 4, workspace, 14
bind = $mainMod $mainC, 5, workspace, 15
bind = $mainMod $mainC, 6, workspace, 16
bind = $mainMod $mainC, 7, workspace, 17
bind = $mainMod $mainC, 8, workspace, 18
bind = $mainMod $mainC, 9, workspace, 19
bind = $mainMod $mainC, 0, workspace, 20

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod $mainC SHIFT, 1, movetoworkspace, 11
bind = $mainMod $mainC SHIFT, 2, movetoworkspace, 12
bind = $mainMod $mainC SHIFT, 3, movetoworkspace, 13
bind = $mainMod $mainC SHIFT, 4, movetoworkspace, 14
bind = $mainMod $mainC SHIFT, 5, movetoworkspace, 15
bind = $mainMod $mainC SHIFT, 6, movetoworkspace, 16
bind = $mainMod $mainC SHIFT, 7, movetoworkspace, 17
bind = $mainMod $mainC SHIFT, 8, movetoworkspace, 18
bind = $mainMod $mainC SHIFT, 9, movetoworkspace, 19
bind = $mainMod $mainC SHIFT, 0, movetoworkspace, 20

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod $mainS, S, movetoworkspace, special:magic
bind = $mainMod $mainC, S, movetoworkspace, +0
bind = $mainMod, X, togglespecialworkspace, music
bind = $mainMod $mainS, X, movetoworkspace, special:music
bind = $mainMod, Q, togglespecialworkspace, terminal
bind = $mainMod $mainS, Q, movetoworkspace, special:terminal
bind = $mainMod, G, togglespecialworkspace, games
bind = $mainMod $mainS, G, movetoworkspace, special:games
bind = $mainMod, H, togglespecialworkspace, easyeffects
bind = $mainMod $mainS, H, movetoworkspace, special:easyeffects

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

bind = $mainMod, left, workspace, e-1
bind = $mainMod, right, workspace, e+1

#Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnesDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

