################
### MONITORS ###
################

monitor=DP-3, 1920x1080@165, 0x0, 1
monitor = DP-3, addreserved, 0, 26, 0, 0

###################
### MY PROGRAMS ###
###################

$zed = zeditor
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun
$menu-calc = rofi -show calc -theme-str 'listview { columns: 1; }' | wl-copy
$menu-clip = ~/.config/rofi/clip-rofi.py
$menu-galery = ~/.config/rofi/galery-rofi.sh
$menu-translate = ~/.config/rofi/rofi-trans.py
$keepass = cat -u ~/Документы/Secrets/Mypass-local.txt | wl-copy -n && /home/kasper/Документы/code/скрипты/timedead.sh & ~/.config/rofi/kpxc-rofi.sh
$cleaner = ~/.local/bin/cleaner
$cursor = hyprctl setcursor Moga-Black 14

#################
### AUTOSTART ###
#################

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/xdg-desktop-portal
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data

# Интерфейс и системные штуки
exec-once = awww-daemon & waybar & dunst
exec-once = hypridle

# Приложения и папки
exec-once = [workspace 1 silent] zen-browser
exec-once = [workspace special:terminal silent] $terminal

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,20
env = HYPRCURSOR_SIZE,20
env = TERMINAL,kitty

