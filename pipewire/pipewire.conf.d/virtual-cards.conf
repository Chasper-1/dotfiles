    { path = "pw-link" args = "-p Browser_Sink:output_1 alsa_output.pci-0000_00_1f.3.analog-stereo:playback_FL" }
    { path = "pw-link" args = "-p Browser_Sink:output_2 alsa_output.pci-0000_00_1f.3.analog-stereo:playback_FR" }
    
    { path = "pw-link" args = "-p Music_Sink:output_1 alsa_output.pci-0000_00_1f.3.analog-stereo:playback_FL" }
    { path = "pw-link" args = "-p Music_Sink:output_2 alsa_output.pci-0000_00_1f.3.analog-stereo:playback_FR" }
    
    { path = "pw-link" args = "-p Discord_Sink:output_1 alsa_output.pci-0000_00_1f.3.analog-stereo:playback_FL" }
    { path = "pw-link" args = "-p Discord_Sink:output_2 alsa_output.pci-0000_00_1f.3.analog-stereo:playback_FR" }
]
