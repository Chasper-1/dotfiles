context.modules = [
    # 1. Создаем твои 4 кабеля
    { name = libpipewire-module-loopback args = { node.name = "Main_Off_Sink" node.description = "Virtual_Main_Off" capture.props = { media.class = "Audio/Sink" } } }
    { name = libpipewire-module-loopback args = { node.name = "Browser_Sink" node.description = "Virtual_Browser" capture.props = { media.class = "Audio/Sink" } } }
    { name = libpipewire-module-loopback args = { node.name = "Music_Sink" node.description = "Virtual_Music" capture.props = { media.class = "Audio/Sink" } } }
    { name = libpipewire-module-loopback args = { node.name = "Discord_Sink" node.description = "Virtual_Discord" capture.props = { media.class = "Audio/Sink" } } }

]

context.exec = [
